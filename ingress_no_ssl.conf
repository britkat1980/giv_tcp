upstream settings {
    server 127.0.0.1:6345;
    server 127.0.0.1:6346 backup;
    server 127.0.0.1:6347 backup;
    server 127.0.0.1:6348 backup;
    server 127.0.0.1:6349 backup;
}

server {
    listen 8099;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    access_log /dev/null;
    error_log /dev/null;
    root /app/ingress;

#   Use a backup server for settings, in case
#   someone doesn't use slot 1 and config page won't work
#    location /REST1/settings {
#        proxy_pass http://settings/settings;
#    }
    # Settings API: /settings and /settings/... only. A plain "location /settings" prefix would also
    # catch /settings.html (the Settings Guide page) and send it to the API
    location ~ ^/settings(/|$) {
        proxy_pass http://127.0.0.1:6350;
    }
    # /REST1/, /REST2/, ... one per configured inverter, written by startup.py (writeRestRoutes)
    include /etc/nginx/givtcp_rest/*.conf;
    # Log viewer (logs.html): a JSON listing of the logs folder, and the .log files (plus rotated days) as
    # plain text. Nothing else under /config/GivTCP is reachable. Range requests let the page read just the end.
    # (The regex is quoted because nginx would otherwise read its {n} counts as a block)
    location = /logs/ {
        alias /config/GivTCP/logs/;
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-store";
    }
    location ~ "^/logs/([A-Za-z0-9_.-]+\.log(\.\d{4}-\d{2}-\d{2})?)$" {
        alias /config/GivTCP/logs/$1;
        types { }
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
    }
    location /dashboard/ {
        proxy_pass http://127.0.0.1:3000/;
    }
    location /rq/ {
        proxy_pass http://127.0.0.1:9181/;
    }
    location = /config.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }
    # The config UI's built files: their names change whenever their content does, so they never go stale
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
        # The other pages, header.html (loaded into every page), CSS and JS keep the same names between releases,
        # so make the browser check for a newer copy each time (a quick 304 when unchanged) rather than reuse
        # an old one after an update
        add_header Cache-Control "no-cache" always;
    }
}
