name: Dependency audit

# Known vulnerabilities in the packages the image is built with: weekly, and whenever they change
on:
  schedule:
    - cron: '17 6 * * 1'
  push:
    paths:
      - 'requirements.txt'
      - 'givtcp-vuejs/package.json'
      - 'givtcp-vuejs/package-lock.json'
      - '.github/workflows/audit.yml'
  pull_request:
    paths:
      - 'requirements.txt'
      - 'givtcp-vuejs/package.json'
      - 'givtcp-vuejs/package-lock.json'
      - '.github/workflows/audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install pip-audit
        run: python -m pip install pip-audit
      # requirements.txt pins every package the image installs. givenergy-modbus comes from a GitHub archive, so
      # pip-audit skips it
      - name: Audit requirements.txt
        run: pip-audit -r requirements.txt --require-hashes --disable-pip --progress-spinner off

  config-page:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: givtcp-vuejs
    steps:
      - uses: actions/checkout@v6
      - name: Audit package-lock.json
        run: npm audit --audit-level=high
