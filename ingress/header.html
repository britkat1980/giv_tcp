<style>
    /* Header styles. Self-contained (and gn- prefixed) because this header is also
       loaded into the Vue config page, which doesn't load pages.css and uses Vuetify classes. */
    /* Explicit spacing, and contain the floated logo, so the header sits the same on every page
       (the config page's base.css zeroes all margins; the static pages keep browser defaults) */
    .gn-head { display: flow-root; margin: 32px auto 20px; }
    .gn-head h1 { font-weight: 600; margin: 8px 0 4px; line-height: 1.3; }
    .gn-head p { font-weight: 500; margin: 0; }

    /* Slim top-bar menu: one clickable card per page */
    .givnav {
        --gn-accent: #4fbba9;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        max-width: 1000px;
        margin: 0 auto 28px;
        padding: 0 16px;
    }
    .givnav *, .givnav *::before, .givnav *::after { box-sizing: border-box; }
    .givnav a.gn-item {
        flex: 1 1 auto;     /* size to the label, then share the spare width */
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        height: 48px;
        margin: 0;
        padding: 0 14px;
        background: #fff;
        color: rgba(0, 0, 0, 0.87);
        border-radius: 4px;
        border-bottom: 3px solid transparent;
        font-size: .95rem;
        font-weight: 500;
        letter-spacing: .0125em;
        white-space: nowrap;
        text-decoration: none;
        box-shadow: 0 2px 1px -1px rgba(0,0,0,.2), 0 1px 1px 0 rgba(0,0,0,.14), 0 1px 3px 0 rgba(0,0,0,.12);
        transition: box-shadow .2s, border-color .2s;
    }
    .givnav a.gn-item:hover {
        text-decoration: none;
        border-bottom-color: rgba(79, 187, 169, 0.5);
        box-shadow: 0 3px 3px -2px rgba(0,0,0,.2), 0 3px 4px 0 rgba(0,0,0,.14), 0 1px 8px 0 rgba(0,0,0,.12);
    }
    .givnav svg { width: 22px; height: 22px; fill: var(--gn-accent); flex: none; }
    .givnav svg.gn-ext { width: 14px; height: 14px; fill: rgba(0, 0, 0, 0.4); margin-left: -4px; }
    /* The page you're on */
    .givnav a.gn-item.gn-active {
        color: var(--gn-accent);
        border-bottom-color: var(--gn-accent);
        pointer-events: none;
    }
</style>

<script>
    (function() {
        // Mark the menu item for the page we're on
        var page = location.pathname.split("/").pop().replace(".html", "");
        $(".givnav .gn-item[data-page='" + page + "']").addClass("gn-active");

        // The dashboard is served on its own port, so it opens on the host IP rather than through ingress
        fetch("hostip.json").then(function(r) { return r.json(); }).then(function(ip) {
            document.getElementById("gn-dashboard").href = "http://" + ip + ":8099/dashboard";
        }).catch(function() {});
    })();
</script>
